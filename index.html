<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Ball PWA</title>
<link rel="manifest" href="manifest.json">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background-color: #1a1a1a;
    margin: 0;
    font-family: 'Inter', sans-serif;
    color: white;
    flex-direction: column;
  }
  canvas {
    background: #000;
    border: 3px solid #66b3ff;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(102, 179, 255, 0.5);
  }
  h1 {
    font-size: 2.5rem;
    color: #66b3ff;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    margin-bottom: 20px;
  }
  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .score-board {
    font-size: 1.5rem;
    color: #fff;
    margin-bottom: 10px;
  }
  .button-container {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .game-button {
    background-color: #4CAF50; /* Green */
    border: none;
    color: white;
    padding: 15px 32px;
    text-align: center;
    text-decoration: none;
    display: inline-block;
    font-size: 16px;
    cursor: pointer;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  .game-button.install {
    background-color: #008CBA; /* Blue */
  }
  .loader {
    border: 4px solid #f3f3f3;
    border-top: 4px solid #66b3ff;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    animation: spin 1s linear infinite;
    display: none;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div class="game-container">
  <h1>Bouncing Ball</h1>
  <div class="score-board">Score: <span id="score">0</span></div>
  <canvas id="gameCanvas" width="480" height="320"></canvas>
  <div class="button-container">
    <button id="installButton" class="game-button install" style="display: none;">Install App</button>
    <button id="generateLevelButton" class="game-button">✨ Generate New Level ✨</button>
  </div>
  <div class="loader" id="loader"></div>
</div>

<script>
  let deferredPrompt; // Variable to hold the event object
  const installButton = document.getElementById('installButton');
  const generateLevelButton = document.getElementById('generateLevelButton');
  const loader = document.getElementById('loader');

  window.addEventListener('beforeinstallprompt', (e) => {
    // Prevent the mini-infobar from appearing on mobile
    e.preventDefault();
    // Stash the event so it can be triggered later.
    deferredPrompt = e;
    // Show the install button
    installButton.style.display = 'block';
  });

  installButton.addEventListener('click', () => {
    // Hide the button
    installButton.style.display = 'none';
    // Show the install prompt
    deferredPrompt.prompt();
    // Wait for the user to respond to the prompt
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        console.log('User accepted the install prompt');
      } else {
        console.log('User dismissed the install prompt');
      }
      deferredPrompt = null;
    });
  });

  // Register the service worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js')
        .then(registration => {
          console.log('Service Worker registered with scope:', registration.scope);
        })
        .catch(error => {
          console.log('Service Worker registration failed:', error);
        });
    });
  }

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let score = 0;
  const scoreDisplay = document.getElementById('score');

  // Ball properties
  let x = canvas.width / 2;
  let y = canvas.height - 30;
  let dx = 2; // Delta x (speed in x direction)
  let dy = -2; // Delta y (speed in y direction)
  const ballRadius = 10;

  // Paddle properties
  const paddleHeight = 10;
  const paddleWidth = 75;
  let paddleX = (canvas.width - paddleWidth) / 2;

  // Bricks properties
  let brickRowCount = 3;
  let brickColumnCount = 5;
  const brickWidth = 75;
  const brickHeight = 20;
  const brickPadding = 10;
  const brickOffsetTop = 30;
  const brickOffsetLeft = 30;

  let bricks = [];

  // Function to create the initial brick layout
  function createBricks() {
    bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
      bricks[c] = [];
      for (let r = 0; r < brickRowCount; r++) {
        bricks[c][r] = { x: 0, y: 0, status: 1 };
      }
    }
  }

  createBricks();

  // Gemini API Integration for level generation
  async function generateNewLevel() {
    loader.style.display = 'block';
    generateLevelButton.disabled = true;

    const apiKey = ""; 
    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

    const prompt = `Create a new brick layout for a breakout game. The layout must be a 2D array of 0s and 1s, where 1 means a brick is present and 0 means it's not. The layout should have ${brickRowCount} rows and ${brickColumnCount} columns. The pattern should be creative and not just a solid block.`;

    const payload = {
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
                type: "OBJECT",
                properties: {
                    "layout": {
                        "type": "ARRAY",
                        "items": {
                            "type": "ARRAY",
                            "items": { "type": "NUMBER" }
                        }
                    }
                }
            }
        },
    };

    try {
        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            throw new Error(`API call failed with status: ${response.status}`);
        }

        const result = await response.json();
        const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;
        if (jsonText) {
            const parsedData = JSON.parse(jsonText);
            const newLayout = parsedData.layout;
            
            // Validate the received layout dimensions
            if (newLayout && newLayout.length === brickRowCount && newLayout.every(row => row.length === brickColumnCount)) {
                // Update the game state with the new layout
                bricks = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    bricks[c] = [];
                    for (let r = 0; r < brickRowCount; r++) {
                        bricks[c][r] = { x: 0, y: 0, status: newLayout[r][c] };
                    }
                }
                
                // Reset game variables to start fresh level
                score = 0;
                scoreDisplay.textContent = score;
                x = canvas.width / 2;
                y = canvas.height - 30;
                dx = 2;
                dy = -2;
            } else {
                console.error("Invalid layout received from API.");
                // Fallback to original layout
                createBricks();
            }
        }
    } catch (error) {
        console.error("Error generating new level:", error);
        // On error, show a message and fall back to the original layout
        showMessage('Error generating level. Please try again.');
        createBricks();
    } finally {
        loader.style.display = 'none';
        generateLevelButton.disabled = false;
    }
  }

  generateLevelButton.addEventListener('click', generateNewLevel);


  // User input
  let rightPressed = false;
  let leftPressed = false;

  // Event listeners for keyboard input
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Right' || e.key === 'ArrowRight') {
      rightPressed = true;
    } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
      leftPressed = true;
    }
  });

  document.addEventListener('keyup', (e) => {
    if (e.key === 'Right' || e.key === 'ArrowRight') {
      rightPressed = false;
    } else if (e.key === 'Left' || e.key === 'ArrowLeft') {
      leftPressed = false;
    }
  });
  
  // Event listeners for touch input (for mobile)
  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault(); // Prevent default scroll behavior
    const touchX = e.touches[0].clientX - canvas.offsetLeft;
    if (touchX > 0 && touchX < canvas.width) {
      paddleX = touchX - paddleWidth / 2;
    }
  });

  // Function to draw the ball on the canvas
  function drawBall() {
    ctx.beginPath();
    ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
    ctx.fillStyle = '#66b3ff';
    ctx.fill();
    ctx.closePath();
  }

  // Function to draw the paddle on the canvas
  function drawPaddle() {
    ctx.beginPath();
    ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
    ctx.fillStyle = '#66b3ff';
    ctx.fill();
    ctx.closePath();
  }

  // Function to draw the bricks on the canvas
  function drawBricks() {
    for (let c = 0; c < brickColumnCount; c++) {
      for (let r = 0; r < brickRowCount; r++) {
        if (bricks[c][r].status === 1) {
          const brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
          const brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
          bricks[c][r].x = brickX;
          bricks[c][r].y = brickY;
          ctx.beginPath();
          ctx.rect(brickX, brickY, brickWidth, brickHeight);
          ctx.fillStyle = '#b366ff'; // Different color for bricks
          ctx.fill();
          ctx.closePath();
        }
      }
    }
  }

  // Function to detect collision between the ball and bricks
  function collisionDetection() {
    for (let c = 0; c < brickColumnCount; c++) {
      for (let r = 0; r < brickRowCount; r++) {
        const b = bricks[c][r];
        if (b.status === 1) {
          if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
            dy = -dy;
            b.status = 0;
            score++;
            scoreDisplay.textContent = score;
            // Check for win condition
            if (score === brickRowCount * brickColumnCount) {
              showMessage('YOU WIN, CONGRATULATIONS!');
              // Wait for a second before reloading
              setTimeout(() => document.location.reload(), 1000);
            }
          }
        }
      }
    }
  }

  // Function to show a message box (instead of using alert)
  function showMessage(message) {
    const messageBox = document.createElement('div');
    messageBox.style.cssText = `
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: #333;
      color: white;
      padding: 20px;
      border-radius: 10px;
      border: 2px solid #66b3ff;
      text-align: center;
      font-size: 24px;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 0.5s forwards;
    `;
    messageBox.textContent = message;
    document.body.appendChild(messageBox);
  }

  // Main game loop
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear the canvas for the next frame
    drawBricks();
    drawBall();
    drawPaddle();
    collisionDetection();

    // Ball movement and wall collision detection
    if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
      dx = -dx;
    }
    if (y + dy < ballRadius) {
      dy = -dy;
    } else if (y + dy > canvas.height - ballRadius) {
      // Check for ball hitting the paddle
      if (x > paddleX && x < paddleX + paddleWidth) {
        dy = -dy;
      } else {
        showMessage('GAME OVER');
        // Wait for a second before reloading
        setTimeout(() => document.location.reload(), 1000);
      }
    }

    // Paddle movement
    if (rightPressed) {
      paddleX += 7;
      if (paddleX + paddleWidth > canvas.width) {
        paddleX = canvas.width - paddleWidth;
      }
    } else if (leftPressed) {
      paddleX -= 7;
      if (paddleX < 0) {
        paddleX = 0;
      }
    }

    x += dx;
    y += dy;

    // Call the draw function again for the next frame
    requestAnimationFrame(draw);
  }

  draw();
</script>

</body>
</html>
